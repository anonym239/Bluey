plugins { id 'com.android.application' }

android {
    namespace 'io.github.anonym239.bluey'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.anonym239.bluey'
        minSdk 26
        targetSdk 35
        versionCode 11
        versionName '1.1'
    }

    signingConfigs {
        // Ein fester Schlüssel, damit neue APKs sich über alte installieren lassen.
        // Nur für die eigene Installation gedacht, nicht für den Play Store.
        shared {
            storeFile file('bluey.keystore')
            storePassword 'bluey-android'
            keyAlias 'bluey'
            keyPassword 'bluey-android'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.shared }
        release {
            signingConfig signingConfigs.shared
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250107'
}
